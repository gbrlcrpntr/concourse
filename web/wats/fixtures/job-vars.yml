---
jobs:
- name: parameterized
  vars:
    branch:
      default: main
      description: branch to build
    count:
      type: number
      default: 1
    dry_run:
      type: boolean
      default: false
    deploy_env:
      type: enum
      options: [dev, prod]
      default: dev
  plan:
  - task: echo-vars
    config:
      platform: linux

      image_resource:
        type: mock
        source: {mirror_self: true}

      run:
        path: sh
        args:
        - -ec
        - |
          echo "branch=((.:branch))"
          echo "count=((.:count))"
          echo "dry_run=((.:dry_run))"
          echo "deploy_env=((.:deploy_env))"
