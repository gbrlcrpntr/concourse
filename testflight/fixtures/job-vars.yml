---
jobs:
- name: echo-vars
  vars:
    branch:
      default: ((default_branch))
      description: branch to build
    label:
      default: ((default_label))
      description: value used to demonstrate runtime default resolution
    count:
      type: number
      default: 1
    dry_run:
      type: boolean
      default: false
    deploy_env:
      type: enum
      options: [dev, prod]
      default: dev
    pr_number:
      type: number
      default: 0
    head_sha:
      default: no-pr
    head_ref:
      default: no-pr
    base_ref:
      default: no-pr
  trigger_webhooks:
  - name: github-pr
    authentication:
      hmac_sha256:
        secret: wh-secret
        header: X-Hub-Signature-256
        prefix: sha256=
    delivery_id:
      header: X-GitHub-Delivery
    filter:
      action:
        one_of: [opened, reopened, synchronize, ready_for_review]
    var_mapping:
      branch: pull_request.head.ref
      pr_number: number
      head_sha: pull_request.head.sha
      head_ref: pull_request.head.ref
      base_ref: pull_request.base.ref
  plan:
  - task: echo-vars
    config:
      platform: linux

      image_resource:
        type: mock
        source: {mirror_self: true}

      run:
        path: sh
        args:
        - -exc
        - |
          echo "branch=((.:branch))"
          echo "label=((.:label))"
          echo "count=((.:count))"
          echo "dry_run=((.:dry_run))"
          echo "deploy_env=((.:deploy_env))"
          echo "pr_number=((.:pr_number))"
          echo "head_sha=((.:head_sha))"
          echo "head_ref=((.:head_ref))"
          echo "base_ref=((.:base_ref))"
