---
jobs:
- name: echo-vars
  vars:
    branch:
      default: ((default_branch))
      description: branch to build
    label:
      default: ((default_label))
      description: value used to demonstrate runtime default resolution
    count:
      type: number
      default: 1
    dry_run:
      type: boolean
      default: false
    deploy_env:
      type: enum
      options: [dev, prod]
      default: dev
  trigger_webhooks:
  - name: github-pr
    token: wh-secret
    filter:
      action: opened
    var_mapping:
      branch: pull_request.head.ref
  plan:
  - task: echo-vars
    config:
      platform: linux

      image_resource:
        type: mock
        source: {mirror_self: true}

      run:
        path: sh
        args:
        - -exc
        - |
          echo "branch=((.:branch))"
          echo "label=((.:label))"
          echo "count=((.:count))"
          echo "dry_run=((.:dry_run))"
          echo "deploy_env=((.:deploy_env))"
