name: Publish job vars PoC image

on:
  push:
    branches:
    - job-vars-poc
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-job-vars-poc-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/gbrlcrpntr/concourse

jobs:
  publish:
    name: Build and publish linux/amd64 image
    if: github.repository == 'gbrlcrpntr/concourse'
    runs-on: ubuntu-latest
    steps:
    - name: Check out the fork
      uses: actions/checkout@v6

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Build web assets
      run: |
        corepack enable
        yarn install --immutable
        yarn build

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push PoC image
      uses: docker/build-push-action@v7
      with:
        context: .
        target: with-fly
        platforms: linux/amd64
        push: true
        tags: |
          ${{ env.IMAGE }}:job-vars-poc
          ${{ env.IMAGE }}:branch-${{ github.ref_name }}
          ${{ env.IMAGE }}:job-vars-poc-${{ github.sha }}
        labels: |
          org.opencontainers.image.title=Concourse job trigger parameters PoC
          org.opencontainers.image.description=Non-production Concourse CI PoC for typed trigger parameters and JSON webhooks
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.licenses=Apache-2.0
        cache-from: type=gha
        cache-to: type=gha,mode=max
